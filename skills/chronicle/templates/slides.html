<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{THEME}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3E:root%7B--bg:%23fbf9f6;--st:%233d4451;%7D@media(prefers-color-scheme:dark)%7B:root%7B--bg:%231c1f26;--st:%23d2d6dd;%7D%7D.b%7Bfill:var(--bg);stroke:var(--st);stroke-width:1.2;%7D.t%7Bfont-family:serif;font-weight:700;font-size:34px;text-anchor:middle;fill:var(--bg);stroke:var(--st);stroke-width:1.2px;paint-order:stroke fill;%7D%3C/style%3E%3Ccircle cx='32' cy='32' r='30' class='b'/%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='var(--st)' stroke-width='0.5' opacity='0.25'/%3E%3Ctext x='32' y='44' class='t'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
{{STYLES}}
  </style>
</head>
<body>
  <div class="chronicle-deck" id="deck">
{{SLIDES}}
  </div>

  <div class="chronicle-deck-ui" id="deck-counter">01 / 01</div>
  <div class="chronicle-deck-progress" id="deck-progress"></div>

  <script>
    (function() {
      const slides = Array.from(document.querySelectorAll('.chronicle-slide'));
      if (slides.length === 0) return;

      const counter = document.getElementById('deck-counter');
      const progress = document.getElementById('deck-progress');
      let currentIdx = 0;

      function updateSlide(index) {
        if (index < 0) index = 0;
        if (index >= slides.length) index = slides.length - 1;
        currentIdx = index;

        slides.forEach((s, i) => {
          if (i === currentIdx) {
            s.classList.add('active');
          } else {
            s.classList.remove('active');
          }
        });

        const pad = (n) => String(n).padStart(2, '0');
        counter.textContent = `${pad(currentIdx + 1)} / ${pad(slides.length)}`;
        progress.style.width = `${((currentIdx + 1) / slides.length) * 100}%`;
        window.location.hash = `slide-${currentIdx + 1}`;
      }

      // Check initial hash
      const hashMatch = window.location.hash.match(/^#slide-(\d+)$/);
      if (hashMatch) {
        const init = parseInt(hashMatch[1], 10) - 1;
        updateSlide(init);
      } else {
        updateSlide(0);
      }

      // Keyboard navigation
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          updateSlide(currentIdx + 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') {
          updateSlide(currentIdx - 1);
        } else if (e.key === 'f' || e.key === 'F') {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        }
      });

      // Click / Touch navigation
      document.body.addEventListener('click', (e) => {
        if (e.clientX > window.innerWidth * 0.7) {
          updateSlide(currentIdx + 1);
        } else if (e.clientX < window.innerWidth * 0.3) {
          updateSlide(currentIdx - 1);
        }
      });
    })();
  </script>
</body>
</html>
